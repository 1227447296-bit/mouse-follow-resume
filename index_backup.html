<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王禹森 · 个人展示</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #020203;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .viewport {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .viewport video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .loader {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
      transition: opacity 0.4s ease;
    }
    .loader.hidden { opacity: 0; pointer-events: none; }
    .loader-ring {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid rgba(91,156,246,0.1);
      border-top-color: #5B9CF6;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="viewport">
  <div class="loader" id="loader"><div class="loader-ring"></div></div>
  <video id="v" preload="auto" muted playsinline></video>
</div>

<script>
(function() {
  'use strict';

  var v = document.getElementById('v');
  var loader = document.getElementById('loader');

  // ── Load video ──
  v.src = './001.mp4';

  // Initial pause at t=0 so we don't miss the first frame
  v.pause();

  v.addEventListener('canplay', function onCanPlay() {
    v.removeEventListener('canplay', onCanPlay);
    v.pause();
    v.currentTime = 0;
    loader.classList.add('hidden');
  });

  v.addEventListener('error', function() {
    console.error('Video error:', v.error);
  });

  // ── Mouse tracking ──
  var prevX = null;
  var targetTime = 0;
  var seekQueue = [];
  var seeking = false;

  window.addEventListener('mousemove', function(e) {
    if (!v.duration || isNaN(v.duration)) return;

    var dx = e.clientX - prevX;
    if (prevX !== null && Math.abs(dx) > 0) {
      var dt = (dx / window.innerWidth) * 0.8 * v.duration;
      targetTime += dt;
      targetTime = Math.max(0, Math.min(v.duration, targetTime));

      seekQueue.push(targetTime);

      if (!seeking) {
        doSeek();
      }
    }

    prevX = e.clientX;
  });

  window.addEventListener('mouseleave', function() { prevX = null; });
  window.addEventListener('mouseenter', function(e) { prevX = e.clientX; });

  function doSeek() {
    if (seekQueue.length === 0) {
      seeking = false;
      return;
    }

    seeking = true;
    var destTime = seekQueue.pop();
    seekQueue.length = 0;

    v.currentTime = destTime;
  }

  v.addEventListener('seeked', function() {
    seeking = false;
    if (seekQueue.length > 0) doSeek();
  });

})();
</script>
</body>
</html>
